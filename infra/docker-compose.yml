services:
  mfi_db:
    image: postgres:16-alpine
    container_name: mfi_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mfi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-mfi}
    volumes:
      - mfi_db_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - mfi_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mfi} -d ${POSTGRES_DB:-mfi}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mfi_redis:
    image: redis:7-alpine
    container_name: mfi_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - mfi_redis_data:/data
    networks:
      - mfi_internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mfi_minio:
    image: minio/minio:latest
    container_name: mfi_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-mfi_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - mfi_minio_data:/data
    networks:
      - mfi_internal
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  mfi_api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: mfi_api
    restart: unless-stopped
    env_file: ../backend/.env
    depends_on:
      mfi_db:
        condition: service_healthy
      mfi_redis:
        condition: service_healthy
    networks:
      - mfi_internal
      - edge_net
      - mail_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  mfi_web:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    container_name: mfi_web
    restart: unless-stopped
    env_file: ../frontend/.env.local
    environment:
      - HOSTNAME=0.0.0.0
    depends_on:
      - mfi_api
    networks:
      - mfi_internal
      - edge_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  mfi_db_data:
  mfi_redis_data:
  mfi_minio_data:

networks:
  mfi_internal:
    name: mfi_internal
  edge_net:
    external: true
  mail_net:
    external: true
